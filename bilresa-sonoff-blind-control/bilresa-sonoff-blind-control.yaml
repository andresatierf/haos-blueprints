# ===================================================================
# IKEA BILRESA E2489 + Sonoff Dual Switch – Electric Blind Control
# Blueprint Template v2.2.0
#
# Internal Versioning:
#   schema_version: 2.2.0
#   last_updated: 2026-03-27
#
# Changelog:
#   v2.2.0: Add duration_fallback_label for helper targeting without area
#   v2.1.0: Add separate open/close switch labels for dual-direction control
#   v2.0.0: Add area+label targeting with global fallback duration
#   v1.1.0: Add duration helper for adjustable run time via single press
#   v1.0.0: Initial release
#
# Button Mapping:
#   Button 1 – Single Press : If running → stop; if idle → increase duration +15s
#   Button 1 – Double Press : Turn ON open switches for duration, then OFF
#   Button 1 – Long Press   : Turn ON open switches while held, OFF on release
#   Button 2 – Single Press : If running → stop; if idle → decrease duration -15s
#   Button 2 – Double Press : Turn ON close switches for duration, then OFF
#   Button 2 – Long Press   : Turn ON close switches while held, OFF on release
#
# Targeting:
#   - Open switches: switch_open_label AND (optional) target_area
#   - Close switches: switch_close_label AND (optional) target_area
#   - Duration helpers:
#       * With area: helper with duration_label in target area
#       * Without area: helper with BOTH duration_label AND duration_fallback_label
#       * If no helpers found, global_duration is used as fallback
# ===================================================================

blueprint:
  name: BILRESA + Sonoff Dual Switch – Electric Blind Control (v2)
  author: censay
  description: >
    Use the IKEA BILRESA E2489 Matter dual-button remote to control electric
    blinds via Sonoff switches.

    Targeting is done by labels (switches and helpers) with an optional area filter.
    Duration helpers can be per-area (with a fallback global helper) or use a
    default value if no helpers are found.
    When no area is selected, use both duration_label AND duration_fallback_label
    to target the helper.

    Button 1 → Open switches (switch_open_label)
    Button 2 → Close switches (switch_close_label)

    Button 1 single press  → if running: stop; if idle: increase duration +15s.
    Button 1 double press  → Open ON for duration then OFF (timed extend).
    Button 1 long press    → Open ON while held, OFF on release (manual extend).

    Button 2 single press  → if running: stop; if idle: decrease duration -15s.
    Button 2 double press  → Close ON for duration then OFF (timed extend).
    Button 2 long press    → Close ON while held, OFF on release (manual extend).
  domain: automation
  source_url: https://github.com/censay/haos-blueprints
  homeassistant:
    min_version: 2025.12.1

  input:
    # ---------------------------------------------------------------
    # BILRESA button event entities
    # ---------------------------------------------------------------

    button1_event:
      name: Button 1 – Event Entity
      description: >
        Select the event entity for Button 1 on the IKEA BILRESA E2489
        (for example: event.bilresa_dual_button_button_1_2).
      selector:
        entity:
          domain: event

    button2_event:
      name: Button 2 – Event Entity
      description: >
        Select the event entity for Button 2 on the IKEA BILRESA E2489
        (for example: event.bilresa_dual_button_button_2_2).
      selector:
        entity:
          domain: event

    # ---------------------------------------------------------------
    # Area filter (optional - applies to switches and helpers)
    # ---------------------------------------------------------------

    target_area:
      name: Target Area (Optional)
      description: >
        Optional area to filter switches and helpers. If not specified,
        all devices matching the labels will be targeted.
      default:
      selector:
        area:

    # ---------------------------------------------------------------
    # Switch targeting - OPEN direction (Button 1)
    # ---------------------------------------------------------------

    switch_open_label:
      name: Switch Open Label (Required)
      description: >
        Label that identifies the Sonoff switches for OPENING blinds.
        All switches with this label will be controlled by Button 1.
        Example: "open" or "blind_open"
      selector:
        label:

    # ---------------------------------------------------------------
    # Switch targeting - CLOSE direction (Button 2)
    # ---------------------------------------------------------------

    switch_close_label:
      name: Switch Close Label (Required)
      description: >
        Label that identifies the Sonoff switches for CLOSING blinds.
        All switches with this label will be controlled by Button 2.
        Example: "close" or "blind_close"
      selector:
        label:

    # ---------------------------------------------------------------
    # Duration helper targeting
    # ---------------------------------------------------------------

    duration_label:
      name: Duration Helper Label (Optional)
      description: >
        Label that identifies the duration helpers.
        If a helper with this label exists in the target area, its value is used.
        Otherwise, the global helper (same label, no area) is used.
        If no area is selected, the helper must have both this label AND the fallback label.
        If no helpers are found, global_duration is used.
      selector:
        label:

    duration_fallback_label:
      name: Duration Helper Fallback Label (Optional)
      description: >
        Secondary label for duration helpers. When no target area is selected,
        the helper must have both duration_label AND this fallback label.
        This helps narrow down to a specific helper when not using area filtering.
      selector:
        label:

    global_duration:
      name: Global Duration (seconds)
      description: >
        Default duration in seconds when no duration helpers are found.
        Used as fallback when duration_label is not set or no matching
        helpers exist.
      default: 15
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds
          mode: box

    long_press_timeout:
      name: Long Press Safety Timeout (seconds)
      description: >
        Maximum time (in seconds) a switch can stay ON during a long press before
        turning off automatically, in case the release event is not received.
      default: 40
      selector:
        number:
          min: 30
          max: 60
          unit_of_measurement: seconds
          mode: box

# ===================================================================
# AUTOMATION LOGIC
# ===================================================================

variables:
  target_area: !input target_area
  switch_open_label: !input switch_open_label
  switch_close_label: !input switch_close_label
  duration_label: !input duration_label
  duration_fallback_label: !input duration_fallback_label
  global_duration: !input global_duration
  long_press_timeout: !input long_press_timeout

trigger:
  - platform: state
    id: button1
    entity_id: !input button1_event
    not_from: "unavailable"
    not_to: "unavailable"
  - platform: state
    id: button2
    entity_id: !input button2_event
    not_from: "unavailable"
    not_to: "unavailable"

condition: []

action:
  - variables:
      press_type: "{{ trigger.to_state.attributes.event_type }}"
      trigger_id: "{{ trigger.id }}"

  - variables:
      open_switches: >
        {% if target_area %}
          {{ area_entities(target_area) | select('match', '^switch\\.') | select('in', label_entities(switch_open_label)) | list }}
        {% else %}
          {{ label_entities(switch_open_label) | select('match', '^switch\\.') | list }}
        {% endif %}

  - variables:
      close_switches: >
        {% if target_area %}
          {{ area_entities(target_area) | select('match', '^switch\\.') | select('in', label_entities(switch_close_label)) | list }}
        {% else %}
          {{ label_entities(switch_close_label) | select('match', '^switch\\.') | list }}
        {% endif %}

  - variables:
      all_switches: "{{ open_switches + close_switches }}"

  - variables:
      duration_helper: >
        {% if duration_label and target_area %}
          {{ (area_entities(target_area) | select('match', '^input_number\.') | intersect(label_entities(duration_label)) | list).0 }}
        {% elif duration_label and duration_fallback_label %}
          {{ (label_entities(duration_label) | select('match', '^input_number\.') | intersect(label_entities(duration_fallback_label)) | list).0 }}
        {% elif duration_label %}
          {{ (label_entities(duration_label) | select('match', '^input_number\.') | list).0 }}
        {% endif %}

  - variables:
      duration_value: >
        {% if duration_helper and duration_helper != '' and states(duration_helper, 'unavailable') != 'unavailable' %}
          {{ states(duration_helper) | float(global_duration) }}
        {% else %}
          {{ global_duration }}
        {% endif %}

  - choose:
      # -------------------------------------------------------------
      # BUTTON 1 – Single Press: stop if running, else increment duration
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button1' and press_type == 'multi_press_1' }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ 'on' in all_switches | map('state') | list }}
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ all_switches }}"
              - conditions:
                  - condition: template
                    value_template: >
                      {{ duration_helper and duration_helper != '' and states(duration_helper, 'unavailable') != 'unavailable' }}
                sequence:
                  - action: input_number.increment
                    target:
                      entity_id: "{{ duration_helper }}"

      # -------------------------------------------------------------
      # BUTTON 1 – Double Press: OPEN ON for duration then OFF
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button1' and press_type == 'multi_press_2' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ all_switches }}"
          - action: switch.turn_on
            target:
              entity_id: "{{ open_switches }}"
          - delay:
              seconds: "{{ duration_value }}"
          - action: switch.turn_off
            target:
              entity_id: "{{ open_switches }}"

      # -------------------------------------------------------------
      # BUTTON 1 – Long Press (on press): OPEN ON; safety timeout OFF
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button1' and press_type == 'long_press' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ all_switches }}"
          - action: switch.turn_on
            target:
              entity_id: "{{ open_switches }}"
          - delay:
              seconds: "{{ long_press_timeout }}"
          - action: switch.turn_off
            target:
              entity_id: "{{ open_switches }}"

      # -------------------------------------------------------------
      # BUTTON 1 – Long Release (on release): OPEN OFF
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button1' and press_type == 'long_release' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ open_switches }}"

      # -------------------------------------------------------------
      # BUTTON 2 – Single Press: stop if running, else decrement duration
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button2' and press_type == 'multi_press_1' }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ 'on' in all_switches | map('state') | list }}
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ all_switches }}"
              - conditions:
                  - condition: template
                    value_template: >
                      {{ duration_helper and duration_helper != '' and states(duration_helper, 'unavailable') != 'unavailable' }}
                sequence:
                  - action: input_number.decrement
                    target:
                      entity_id: "{{ duration_helper }}"

      # -------------------------------------------------------------
      # BUTTON 2 – Double Press: CLOSE ON for duration then OFF
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button2' and press_type == 'multi_press_2' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ all_switches }}"
          - action: switch.turn_on
            target:
              entity_id: "{{ close_switches }}"
          - delay:
              seconds: "{{ duration_value }}"
          - action: switch.turn_off
            target:
              entity_id: "{{ close_switches }}"

      # -------------------------------------------------------------
      # BUTTON 2 – Long Press (on press): CLOSE ON; safety timeout OFF
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button2' and press_type == 'long_press' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ all_switches }}"
          - action: switch.turn_on
            target:
              entity_id: "{{ close_switches }}"
          - delay:
              seconds: "{{ long_press_timeout }}"
          - action: switch.turn_off
            target:
              entity_id: "{{ close_switches }}"

      # -------------------------------------------------------------
      # BUTTON 2 – Long Release (on release): CLOSE OFF
      # -------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger_id == 'button2' and press_type == 'long_release' }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ close_switches }}"

mode: restart
